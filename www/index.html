<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>AIoT-Edge telemetry</title>
  <link rel="stylesheet" href="styles.css">
</head>
<body>
  <main>
    <header>
      <div>
        <h1>AIoT-Edge</h1>
        <p>Educational telemetry estimates — not medical diagnosis</p>
      </div>
      <span id="mode" class="badge offline">OFFLINE</span>
    </header>

    <section class="connection" aria-labelledby="connection-heading">
      <h2 id="connection-heading">Connection</h2>
      <label>Backend WebSocket URL
        <input id="endpoint" type="url" placeholder="wss://example.test/telemetry">
      </label>
      <label>Short-lived dashboard access token
        <input id="access-token" type="password" autocomplete="off" placeholder="Not stored by the dashboard">
      </label>
      <div class="controls">
        <button id="connect">Connect live</button>
        <button id="disconnect" disabled>Disconnect</button>
        <button id="simulation">Start deterministic simulation</button>
        <button id="export">Export CSV</button>
      </div>
      <p id="connection-status" role="status">Disconnected</p>
    </section>

    <section class="metrics" aria-label="Latest telemetry">
      <article><h2>Heart rate</h2><output id="heart-rate">—</output><span>bpm</span></article>
      <article><h2>SpO₂ estimate</h2><output id="spo2">—</output><span>%</span></article>
      <article><h2>Temperature</h2><output id="temperature">—</output><span>°C</span></article>
      <article><h2>Acceleration</h2><output id="acceleration">—</output><span>mg</span></article>
      <article><h2>Wake event</h2><output id="wake">None</output></article>
      <article><h2>Data age</h2><output id="age">—</output><span>s</span></article>
    </section>

    <section>
      <h2>Recent samples</h2>
      <table>
        <thead><tr><th>Time</th><th>Mode</th><th>HR</th><th>SpO₂</th><th>Temp</th><th>X/Y/Z</th></tr></thead>
        <tbody id="history"></tbody>
      </table>
    </section>
  </main>
  <script type="module" src="app.js"></script>
</body>
</html>
