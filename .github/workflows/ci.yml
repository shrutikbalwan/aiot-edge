name: CI

on:
  push:
    branches: [main]
  pull_request:

jobs:
  host:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: "3.13"
          cache: pip
          cache-dependency-path: requirements-ml.txt
      - uses: actions/setup-node@v4
        with:
          node-version: "22"
          cache: npm
      - run: npm ci
      - run: pip install -r requirements-ml.txt
      - run: python -m compileall ml tests scripts
      - run: python -m pytest
        env:
          PYTEST_DISABLE_PLUGIN_AUTOLOAD: "1"
      - run: python -m ml.pipeline --synthetic-demo --epochs 1 --embed-c
      - run: npm run lint
      - run: npm test
      - run: python scripts/secret_scan.py
      - run: python scripts/check_docs.py

  esp-idf:
    runs-on: ubuntu-latest
    container: espressif/idf:v5.1.6
    steps:
      - uses: actions/checkout@v4
      - name: Build default and optional feature profiles
        shell: bash
        run: |
          source /opt/esp/idf/export.sh
          idf.py set-target esp32s3
          idf.py fullclean
          idf.py build
          idf.py -B build-features -D SDKCONFIG=sdkconfig.features -D 'SDKCONFIG_DEFAULTS=sdkconfig.defaults;config/examples/sdkconfig.features.defaults' build
